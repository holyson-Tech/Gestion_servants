services:
  - type: web
    name: servants-gsm
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: servants-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: servants-redis
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: keyvalue
    name: servants-redis
    plan: free
    ipAllowList: []

databases:
  - name: servants-db
    plan: free
