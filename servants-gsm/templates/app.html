<dialog id="mo"><h2 style="margin-top:0">Plus</h2><button class="btn g" style="width:100%;margin-bottom:8px;text-align:left" onclick="$('#mo').close();go('cal')">✝ Calendrier liturgique</button><button class="btn g" style="width:100%;margin-bottom:8px;text-align:left" onclick="$('#mo').close();go('reu')">🗓️ Réunions et assemblées</button><button class="btn g" style="width:100%;margin-bottom:8px;text-align:left" onclick="$('#mo').close();go('bilan')">📊 Bilan des messes</button><button class="btn g" style="width:100%;margin-bottom:8px;text-align:left" onclick="$('#mo').close();go('droits')">💰 Droits statutaires</button><button class="btn g" style="width:100%;margin-bottom:8px;text-align:left" onclick="$('#mo').close();go('cot')">🤝 Cotisations diverses</button><button class="btn" style="width:100%" onclick="$('#mo').close()">Fermer</button></dialog>
<footer id="ft"></footer>
<div class="toast" id="toast"></div><dialog id="dlg"></dialog>
<!--GSM--><script>
const DATA=[];
const LV=["Aspirant2","Acolyte","Céroféraire","Cérémoniaire","Thuriféraire2"];
const PF={Aspirant2:"AS",Acolyte:"AC","Céroféraire":"CF","Cérémoniaire":"CR","Thuriféraire2":"TR"};
const KEY="gsm-sfa-v1";
let S=load(),tab="dash",Q="",LF="",cur="";
function load(){try{const r=null;if(r){const o=JSON.parse(r);o.mess=o.mess||{};o.extra=o.extra||{};o.reu=o.reu||[];o.prog=o.prog||null;o.ann=o.ann||[];o.cfg=o.cfg||{};o.dy=o.dy||migDy(o);return o}}catch(e){}
return{servants:DATA.map(([m,n,s,l])=>({m,n,s,l})),droits:{},cot:[],mess:{},extra:{},reu:[],prog:null,ann:[],cfg:{},dy:[{id:pastY(),mt:2000,v:{}}]}}
function save(){push();toast()}
const $=s=>document.querySelector(s),main=$("#main");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>Number(v)||0,fmt=n=>num(n).toLocaleString("fr-FR")+" FCFA";
const sorted=()=>S.servants.slice().sort((a,b)=>a.n.localeCompare(b.n,"fr"));
const match=s=>(!Q||(s.n+" "+s.m).toLowerCase().includes(Q.toLowerCase()))&&(!LF||s.l===LF);
function go(t){if(!AUTH){pubHome();return}tab=t;Q="";LF="";DF="";nav(t);hl(t);({dash:vDash,serv:vServ,reu:vReu,cal:vCal,prog:vProg,mess:vMess,bilan:vBilan,droits:vDroits,cot:vCot})[t]()}
function vDash(){
const n=S.servants.length,f=S.servants.filter(s=>s.s==="F").length,mx=Math.max(1,...LV.map(l=>S.servants.filter(s=>s.l===l).length));
const dd=dst(YR());
main.innerHTML=`<div class="card">${litBanner(today())}</div><button class="btn" style="width:100%;min-height:58px;font-size:17px;margin:10px 0" onclick="MD=today();go('mess')">✝ Saisir les présences à la messe</button><h2>Rapport de l’effectif</h2><div class="grid"><div class="card"><b>${n}</b><span>Servants enregistrés</span></div><div class="card"><b>${n-f}</b><span>Garçons (M)</span></div><div class="card"><b>${f}</b><span>Filles (F)</span></div><div class="card"><b>${Object.values(S.mess).filter(a=>a.length).length}</b><span>Messes enregistrées</span></div><div class="card"><b>${S.reu.filter(r=>r.t==="R").length}</b><span>Réunions tenues</span></div><div class="card"><b>${S.reu.filter(r=>r.t==="A").length}</b><span>Assemblées générales</span></div></div>
<h2>Répartition par niveau</h2><div class="card">${LV.map(l=>{const c=S.servants.filter(s=>s.l===l).length;return`<div class="row"><i>${l}</i><div style="width:${c/mx*60}%"></div><em>${c}</em></div>`}).join("")}</div>
<h2>Droits statutaires ${YR().id}</h2><div class="grid"><div class="card"><b>${dd.p}/${n}</b><span>Servants à jour</span></div><div class="card"><b>${fmt(dd.t)}</b><span>Perçu</span></div><div class="card"><b>${fmt(dd.q)}</b><span>Reste à percevoir</span></div></div>
<div class="tools" style="margin-top:14px"><button class="btn g" onclick="window.print()">Imprimer le rapport</button></div><h2>Sauvegarde des données</h2><div class="tools"><button class="btn" onclick="exportD()">⬇ Sauvegarder / envoyer</button><label class="btn g" style="display:inline-flex;align-items:center;justify-content:center;cursor:pointer">⬆ Restaurer<input type="file" accept=".json,application/json" hidden onchange="importD(this.files[0])"></label></div><p class="mu">Faites une sauvegarde régulièrement et gardez le fichier en lieu sûr (WhatsApp, e-mail, clé USB).</p><h2>Réception des messages WhatsApp</h2><div class="card tools"><input id="wan" type="tel" inputmode="tel" placeholder="242066005625" value="${esc((S.cfg&&S.cfg.wa)||"242066005625")}"><button class="btn" onclick="setWa()">Enregistrer</button></div><p class="mu">Numéro qui reçoit les messages des formulaires : indicatif du pays + numéro, sans « + » ni espaces.</p>${AUTH&&AUTH.admin?'<h2>Comptes du bureau</h2><div class="card tools"><a class="btn" href="/admin/auth/user/">Gérer les comptes</a><a class="btn g" href="/admin/core/auditlog/">Journal des paiements</a></div>':''}`}
function toolbar(extra){return`<div class="tools"><input type="search" placeholder="Rechercher un nom ou un matricule…" value="${esc(Q)}" oninput="Q=this.value;draw()"><select onchange="LF=this.value;draw()"><option value="">Tous les niveaux</option>${LV.map(l=>`<option ${LF===l?"selected":""}>${l}</option>`).join("")}</select>${extra||""}</div>`}
function draw(){({serv:dServ,reu:dReu,seance:dSeance,mess:dMess,bilan:dBilan,droits:dDroits,cot:dCot})[tab]()}
function vServ(){main.innerHTML=`<h2>Liste des servants</h2>${toolbar('<button class="btn" onclick="edit()">+ Ajouter</button>')}<div class="wrap"><table class="st ss"><thead><tr><th>Matricule</th><th>Noms &amp; prénoms</th><th>Sexe</th><th>Niveau</th><th>Messes servies</th></tr></thead><tbody id="tb"></tbody><tfoot><tr><td colspan="5" id="cnt"></td></tr></tfoot></table></div><button class="fab" aria-label="Ajouter un servant" onclick="edit()">+</button><p class="mu">Touchez un servant pour voir ses messes, ses réunions et ses paiements.</p>`;dServ()}
function dServ(){const r=sorted().filter(match);$("#tb").innerHTML=r.map(s=>`<tr class="clk" onclick="openF('${s.m}')"><td>${esc(s.m)}</td><td>${esc(s.n)}<span class="mb mu"> · ${esc(s.m)}</span></td><td>${s.s}</td><td><span class="tag">${s.l}</span></td><td>${nb(s.m)}</td></tr>`).join("")||`<tr><td colspan="5" class="mu">Aucun résultat.</td></tr>`;$("#cnt").textContent=r.length+" servant(s) affiché(s)"}
function nextM(l){const p=PF[l];let m=0;S.servants.forEach(s=>{if(s.m.startsWith(p)){const k=parseInt(s.m.slice(2));if(k>m)m=k}});m++;return p+((p==="AS"||p==="AC")&&m<10?"0":"")+m}
function edit(m){const s=m?S.servants.find(x=>x.m===m):{m:"",n:"",s:"M",l:"Aspirant2"},d=$("#dlg");
d.innerHTML=`<h2 style="margin-top:0">${m?"Modifier":"Nouveau"} servant</h2><label>Noms &amp; prénoms</label><input id="fn" value="${esc(s.n)}"><label>Sexe</label><select id="fs"><option ${s.s==="M"?"selected":""}>M</option><option ${s.s==="F"?"selected":""}>F</option></select><label>Niveau</label><select id="fl">${LV.map(l=>`<option ${s.l===l?"selected":""}>${l}</option>`).join("")}</select>${m?`<label>Matricule (unique)</label><input value="${esc(m)}" disabled>`:""}
<div class="acts">${m?`<button class="btn r" id="del" onclick="del('${m}')">Supprimer</button>`:""}<button class="btn g" onclick="$('#dlg').close()">Annuler</button><button class="btn" onclick="saveS('${m||""}')">Enregistrer</button></div>`;d.showModal()}
function saveS(m){const n=$("#fn").value.trim();if(!n){$("#fn").focus();return}const v={n,s:$("#fs").value,l:$("#fl").value};
if(m)Object.assign(S.servants.find(x=>x.m===m),v);else S.servants.push({m:nextM(v.l),...v});save();$("#dlg").close();refS();}
function del(m){const b=$("#del");if(!b.dataset.c){b.dataset.c=1;b.textContent="Confirmer la suppression";return}
S.servants=S.servants.filter(x=>x.m!==m);delete S.droits[m];S.cot.forEach(c=>delete c.v[m]);S.reu.forEach(r=>r.p=r.p.filter(x=>x!==m));S.dy.forEach(y=>delete y.v[m]);Object.keys(S.mess).forEach(k=>S.mess[k]=S.mess[k].filter(x=>x!==m));save();$("#dlg").close();refS()}
function pastY(){const d=new Date(),y=d.getFullYear();return d.getMonth()+1>=9?y+"-"+(y+1):(y-1)+"-"+y}
function migDy(o){const mt=Number(o.dmt)||2000,v={};Object.keys(o.droits||{}).forEach(m=>{const d=o.droits[m]||{},x=d.p?mt:Number(d.av)||0;if(x>0)v[m]=x});return[{id:pastY(),mt,v}]}
const nextY=id=>{const a=parseInt(id)+1;return a+"-"+(a+1)};
let DF="",DY="";
const YR=()=>S.dy.find(y=>y.id===DY)||S.dy.find(y=>y.id===pastY())||S.dy[S.dy.length-1];
const dst=y=>{let p=0,t=0,q=0;S.servants.forEach(s=>{const v=y.v[s.m]||0;t+=num(v);q+=mq(y,v);if(cs(y,v)[0]==="Payé")p++});return{n:S.servants.length,p,t,q}};
function vDroits(){const y=YR(),last=S.dy.map(x=>x.id).sort().pop();
main.innerHTML=`<h2>Droits statutaires</h2><div class="card tools"><select onchange="DY=this.value;vDroits()">${S.dy.slice().sort((a,b)=>b.id.localeCompare(a.id)).map(x=>`<option value="${x.id}" ${x.id===y.id?"selected":""}>Année ${x.id}</option>`).join("")}</select><span class="mu" style="align-self:center">Montant dû par servant :</span><input type="number" min="0" value="${y.mt||""}" placeholder="0" onchange="setDy(this.value)" style="width:130px"></div><div class="grid" id="sm"></div>${toolbar('<select onchange="DF=this.value;draw()"><option value="">Tous les statuts</option>'+["Payé","Partiel","Non payé"].map(s=>'<option '+(DF===s?"selected":"")+'>'+s+'</option>').join("")+'</select><button class="btn g" onclick="window.print()">Imprimer</button><button class="btn g" onclick="copyT()">Copier (tableur)</button>')}<div class="wrap"><table class="st sc"><thead><tr><th>Matricule</th><th>Noms &amp; prénoms</th><th>Sexe</th><th>Statut</th><th>Versé</th><th>Manquant</th></tr></thead><tbody id="tb"></tbody></table></div><p class="mu">Manquant = montant dû − montant versé. Les droits statutaires sont suivis année par année.</p><details class="card" style="margin-top:12px"><summary style="cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600">Nouvelle année</summary><div class="tools" style="margin-top:8px"><input id="ny" value="${nextY(last)}" placeholder="2027-2028"><input id="nm2" type="number" min="0" value="${y.mt||2000}" placeholder="Montant"><button class="btn" onclick="addY()">Créer l’année</button></div>${S.dy.length>1?`<button class="btn r" id="dyd" style="margin-top:8px" onclick="delY()">Supprimer l’année ${y.id}</button>`:""}</details>`;dDroits()}
function dDroits(){const y=YR();$("#tb").innerHTML=sorted().filter(s=>match(s)&&(!DF||cs(y,y.v[s.m]||0)[0]===DF)).map(s=>{const v=y.v[s.m]||0,r=cs(y,v);return`<tr><td>${esc(s.m)}</td><td>${esc(s.n)}<span class="mb mu"> · ${esc(s.m)}</span></td><td>${s.s}</td><td id="dt_${s.m}" class="${r[1]}">${r[0]}</td><td><input type="number" placeholder="Versé" min="0" value="${v||""}" oninput="sDy('${s.m}',this.value)"></td><td id="dq_${s.m}">${fmt(mq(y,v))}</td></tr>`}).join("")||`<tr><td colspan="6" class="mu">Aucun résultat.</td></tr>`;sumD()}
function sDy(m,v){const y=YR();y.v[m]=num(v);save();const r=cs(y,y.v[m]),e=$("#dt_"+m),q=$("#dq_"+m);if(e){e.textContent=r[0];e.className=r[1]}if(q)q.textContent=fmt(mq(y,y.v[m]));sumD()}
function sumD(){const e=$("#sm");if(!e)return;const d=dst(YR());e.innerHTML=`<div class="card"><b>${d.p}/${d.n}</b><span>Servants à jour</span></div><div class="card"><b>${fmt(d.t)}</b><span>Versé</span></div><div class="card"><b>${fmt(d.q)}</b><span>Manquant</span></div>`}
function setDy(v){YR().mt=num(v);save();dDroits();sumD()}
function addY(){const id=$("#ny").value.trim();if(!/^\d{4}-\d{4}$/.test(id)){$("#ny").focus();return}if(!S.dy.some(x=>x.id===id))S.dy.push({id,mt:num($("#nm2").value),v:{}});DY=id;save();vDroits()}
function delY(){const b=$("#dyd");if(!b.dataset.c){b.dataset.c=1;b.textContent="Confirmer la suppression";return}const id=YR().id;S.dy=S.dy.filter(x=>x.id!==id);DY="";save();vDroits()}
const mq=(c,v)=>Math.max(0,num(c.mt)-num(v)),cs=(c,v)=>{v=num(v);const t=num(c.mt);return t>0?(v>=t?["Payé","ok"]:v>0?["Partiel","mu"]:["Non payé","no"]):(v>0?["Payé","ok"]:["Non payé","no"])};
const C=()=>S.cot.find(c=>c.id===cur);
function vCot(){if(!S.cot.some(c=>c.id===cur))cur=S.cot[0]?S.cot[0].id:"";
main.innerHTML=`<h2>Cotisations diverses</h2><div class="card tools"><input id="nm" placeholder="Motif (ex. Tisanes de Pâques)" style="flex:2;min-width:180px"><input id="nt" type="number" min="0" placeholder="Montant dû par servant" style="flex:1;min-width:150px"><button class="btn" onclick="newC()">Créer</button></div>${S.cot.length?`<div class="tools"><select onchange="cur=this.value;vCot()">${S.cot.map(c=>`<option value="${c.id}" ${c.id===cur?"selected":""}>${esc(c.motif)}</option>`).join("")}</select><span class="mu" style="align-self:center">Montant dû par servant :</span><input type="number" min="0" value="${C().mt||""}" placeholder="0" onchange="setMt(this.value)" style="width:130px"><details style="flex:1 1 100%"><summary class="btn g" style="display:flex;align-items:center;justify-content:center;cursor:pointer">Plus d’actions</summary><div class="tools" style="margin-top:8px"><button class="btn g" onclick="window.print()">Imprimer</button><button class="btn g" onclick="copyT()">Copier (tableur)</button><button class="btn r" id="dc" onclick="delC()">Supprimer la cotisation</button></div></details></div>${toolbar()}<div class="wrap"><table class="st sc"><thead><tr><th>Matricule</th><th>Noms &amp; prénoms</th><th>Sexe</th><th>Statut</th><th>Versé</th><th>Manquant</th></tr></thead><tbody id="tb"></tbody><tfoot><tr><td colspan="4" id="t0"></td><td id="t1"></td><td id="t2"></td></tr></tfoot></table></div><p class="mu">Manquant = montant dû − montant versé.</p>`:`<p class="mu">Aucune cotisation pour le moment. Créez-en une avec son motif et le montant dû par servant.</p>`}`;if(S.cot.length)dCot()}
function dCot(){const c=C();$("#tb").innerHTML=sorted().filter(match).map(s=>{const v=c.v[s.m]||0,r=cs(c,v);return`<tr><td>${esc(s.m)}</td><td>${esc(s.n)}<span class="mb mu"> · ${esc(s.m)}</span></td><td>${s.s}</td><td id="st_${s.m}" class="${r[1]}">${r[0]}</td><td><input type="number" placeholder="Versé" min="0" value="${v||""}" oninput="sC('${s.m}',this.value)"></td><td id="mq_${s.m}">${fmt(mq(c,v))}</td></tr>`}).join("");tC()}
function tC(){const c=C();let a=0,t=0,q=0;S.servants.forEach(s=>{const v=c.v[s.m]||0;a+=num(c.mt);t+=num(v);q+=mq(c,v)});$("#t0").textContent="TOTAL – attendu : "+fmt(a);$("#t1").textContent=fmt(t);$("#t2").textContent=fmt(q)}
function sC(m,v){const c=C();c.v[m]=num(v);save();const e=$("#st_"+m),r=cs(c,c.v[m]),q=$("#mq_"+m);if(e){e.textContent=r[0];e.className=r[1]}if(q)q.textContent=fmt(mq(c,c.v[m]));tC()}
function newC(){const m=$("#nm").value.trim();if(!m)return;cur="c"+Date.now();S.cot.push({id:cur,motif:m,mt:num($("#nt").value),v:{}});save();vCot()}
function setMt(v){C().mt=num(v);save();dCot()}
function delC(){const b=$("#dc");if(!b.dataset.c){b.dataset.c=1;b.textContent="Confirmer ?";return}S.cot=S.cot.filter(c=>c.id!==cur);save();vCot()}
function copyT(){const t=[...document.querySelectorAll("table tr")].map(r=>[...r.children].map(c=>(c.querySelector("input")?c.querySelector("input").value:c.textContent).trim()).join("\t")).join("\n");
try{navigator.clipboard.writeText(t).then(()=>alert("Copié : collez dans Excel ou Google Sheets."),fb)}catch(e){fb()}
function fb(){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");alert("Copié.")}catch(e){}a.remove()}}
const SL={"0630":"6h30","1700":"17h00","0800":"8h00","1000":"10h00"},JR=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let MD=today(),MS="",BP="";const addDay=(d,n)=>new Date(new Date(d+"T12:00:00Z").getTime()+n*864e5).toISOString().slice(0,10);
function tg(e,r){if(e.target.tagName!=="INPUT")r.querySelector("input").click()}
const nb=m=>Object.values(S.mess).filter(a=>a.includes(m)).length;
const slots=d=>{const w=new Date(d+"T12:00:00").getDay(),q=lit(d).e;if(q===-2||q===-1)return[];return w===0?["0800","1000"]:w===6?["0630","1700"]:["0630"]};
const mk=()=>MD+"|"+MS;
function vMess(){const sl=slots(MD),ex=S.extra[MD]||[],all=[...sl,...ex.map(e=>e.id)];if(!all.includes(MS))MS=all[0]||"";if(!MS){main.innerHTML=`<h2>Messes servies</h2><div class="card">${litBanner(MD)}</div><div class="card tools"><input type="date" value="${MD}" onchange="MD=this.value||today();vMess()"></div><p class="mu">Pas de messe ordinaire ce jour.</p>${xForm()}`;return}
main.innerHTML=`<h2>Messes servies</h2><div class="card">${litBanner(MD)}</div><div class="card tools"><button class="btn g" onclick="MD=addDay(MD,-1);vMess()">◀</button><input type="date" value="${MD}" onchange="MD=this.value||today();vMess()"><button class="btn g" onclick="MD=addDay(MD,1);vMess()">▶</button><b style="align-self:center">${JR[new Date(MD+"T12:00:00").getDay()]}</b>${sl.map(s=>`<button class="btn ${s===MS?"":"g"}" onclick="MS='${s}';vMess()">Messe de ${SL[s]}</button>`).join("")}${ex.map(e=>`<button class="btn ${e.id===MS?"":"g"}" onclick="MS='${e.id}';vMess()">★ ${esc(e.lb)}${e.tm?" · "+e.tm.replace(":","h"):""}</button>`).join("")}${MS[0]==="x"?`<button class="btn r" id="dx" onclick="delExtra('${MS}')">Supprimer</button>`:""}</div>${toolbar('<button class="btn g" onclick="allM(1)">Tout cocher</button><button class="btn g" onclick="allM(0)">Tout décocher</button>')}<div class="wrap"><table><thead><tr><th>Présent</th><th>Matricule</th><th>Noms &amp; prénoms</th><th>Niveau</th></tr></thead><tbody id="tb"></tbody><tfoot><tr><td colspan="4" id="cnt"></td></tr></tfoot></table></div>${xForm()}<div class="chip" id="chip"></div><p class="mu">Cochez les servants qui ont servi cette messe. Horaires : lundi à vendredi 6h30 ; samedi 6h30 et 17h00 ; dimanche 8h00 et 10h00.</p>`;dMess()}
function dMess(){const a=S.mess[mk()]||[];$("#tb").innerHTML=sorted().filter(match).map(s=>`<tr onclick="tg(event,this)"><td><input type="checkbox" ${a.includes(s.m)?"checked":""} onchange="tM('${s.m}',this.checked)" style="width:20px;height:20px;min-width:0"></td><td>${esc(s.m)}</td><td>${esc(s.n)}</td><td><span class="tag">${s.l}</span></td></tr>`).join("");cM()}
function cM(){const n=(S.mess[mk()]||[]).length;$("#cnt").textContent=n+" servant(s) présent(s) à cette messe";const c=$("#chip");if(c)c.textContent="✓ "+n+" présent(s)"}
function tM(m,c){const k=mk();let a=(S.mess[k]||[]).filter(x=>x!==m);if(c)a.push(m);S.mess[k]=a;save();cM()}
